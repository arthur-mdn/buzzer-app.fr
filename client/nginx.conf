server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    location = /fr {
        return 301 /;
    }

    location = /fr/ {
        return 301 /;
    }

    location ~ ^/(en|es|de|zh|ru)/?$ {
        try_files /$1/index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
